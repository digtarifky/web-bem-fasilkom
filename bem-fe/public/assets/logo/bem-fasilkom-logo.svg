<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="aetherionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Tech Segmentations -->
  <circle cx="60" cy="60" r="54" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="16 6 8 6" opacity="0.85" />
  
  <!-- Subtle Inner Orbit -->
  <circle cx="60" cy="60" r="44" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Aetherion Flame / Infinite Core -->
  <g filter="url(#glow)">
    <!-- Outer Flame Crest -->
    <path d="M60 22 C68 36 82 48 82 66 C82 78.15 72.15 88 60 88 C47.85 88 38 78.15 38 66 C38 48 52 36 60 22 Z" fill="url(#aetherionGrad)" opacity="0.9" />
    <!-- Inner Core Wing/Flame -->
    <path d="M60 38 C64 48 72 56 72 68 C72 74.63 66.63 80 60 80 C53.37 80 48 74.63 48 68 C48 56 56 48 60 38 Z" fill="#FEF08A" opacity="0.95" />
    <circle cx="60" cy="66" r="6" fill="#FFFFFF" />
  </g>

  <!-- Tech Dots / Satellites -->
  <circle cx="60" cy="12" r="3.5" fill="#FBBF24" />
  <circle cx="108" cy="60" r="3" fill="#EA580C" />
  <circle cx="12" cy="60" r="3" fill="#EA580C" />
  <circle cx="60" cy="108" r="3.5" fill="#FBBF24" />
</svg>

